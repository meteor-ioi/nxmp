name: Build NXMP

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Configure safe directory
        run: |
          git config --global --add safe.directory '*'

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build tools
        run: |
          apt-get update && apt-get install -y unzip wget p7zip-full git unar
          dkp-pacman -Sy --noconfirm switch-dav1d switch-libarchive

      - name: Deploy Author's Precompiled NXMP Portlibs
        run: |
          wget -q https://github.com/proconsule/nxmp-portlibs/releases/download/v1.0.0/nxmp.nightly.portibs.zip -O /tmp/portlibs.zip
          unzip -o -q /tmp/portlibs.zip -d /opt/devkitpro/portlibs/
          # Fix nested directory structure if present
          if [ -d /opt/devkitpro/portlibs/switch/switch ]; then
            cp -rf /opt/devkitpro/portlibs/switch/switch/* /opt/devkitpro/portlibs/switch/
            rm -rf /opt/devkitpro/portlibs/switch/switch
          fi
          # Ensure freetype headers are accessible at both include/ and include/freetype2/
          if [ -d /opt/devkitpro/portlibs/switch/include/freetype2 ]; then
            cp -rn /opt/devkitpro/portlibs/switch/include/freetype2/* /opt/devkitpro/portlibs/switch/include/ || true
          fi
          rm -f /tmp/portlibs*

      - name: Deploy Header-Only GLM
        run: |
          git clone --depth 1 https://github.com/g-truc/glm.git /tmp/glm
          cp -rf /tmp/glm/glm /opt/devkitpro/portlibs/switch/include/
          rm -rf /tmp/glm

      - name: Deploy Complete MPV Headers
        run: |
          mkdir -p /opt/devkitpro/portlibs/switch/include/mpv
          wget -q https://raw.githubusercontent.com/averne/mpv/master/libmpv/client.h -O /opt/devkitpro/portlibs/switch/include/mpv/client.h
          wget -q https://raw.githubusercontent.com/averne/mpv/master/libmpv/render.h -O /opt/devkitpro/portlibs/switch/include/mpv/render.h
          wget -q https://raw.githubusercontent.com/averne/mpv/master/libmpv/render_dk3d.h -O /opt/devkitpro/portlibs/switch/include/mpv/render_dk3d.h
          wget -q https://raw.githubusercontent.com/averne/mpv/master/libmpv/render_gl.h -O /opt/devkitpro/portlibs/switch/include/mpv/render_gl.h || true

      - name: Build NXMP NRO
        run: |
          . /opt/devkitpro/switchvars.sh || true
          export PORTLIBS=${PORTLIBS:-$DEVKITPRO/portlibs/switch}
          export PATH=$DEVKITPRO/devkitA64/bin:$DEVKITPRO/tools/bin:$PORTLIBS/bin:$PATH
          sed -i 's|#include FT_FREETYPE_H|#include <freetype/freetype.h>|g' libs/imgui/misc/freetype/imgui_freetype.cpp || true
          sed -i 's|#include FT_MODULE_H|#include <freetype/ftmodapi.h>|g' libs/imgui/misc/freetype/imgui_freetype.cpp || true
          sed -i 's|#include FT_GLYPH_H|#include <freetype/ftglyph.h>|g' libs/imgui/misc/freetype/imgui_freetype.cpp || true
          sed -i 's|#include FT_SYNTHESIS_H|#include <freetype/ftsynth.h>|g' libs/imgui/misc/freetype/imgui_freetype.cpp || true
          make clean || true
          make -j$(nproc)

      - name: Upload NXMP NRO
        uses: actions/upload-artifact@v4
        with:
          name: nxmp-nro-release
          path: |
            *.nro
            *.nacp
