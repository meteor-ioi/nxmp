name: Build NXMP

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Configure safe directory
        run: |
          git config --global --add safe.directory '*'

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build tools
        run: |
          apt-get update && apt-get install -y unzip wget p7zip-full cmake git

      - name: Deploy Author's Precompiled NXMP Portlibs
        run: |
          wget -q https://github.com/proconsule/nxmp-portlibs/releases/download/v1.0.0/nxmp.nightly.portibs.zip -O /tmp/portlibs.zip
          unzip -o -q /tmp/portlibs.zip -d /opt/devkitpro/portlibs/
          # Fix nested directory structure if present
          if [ -d /opt/devkitpro/portlibs/switch/switch ]; then
            cp -rf /opt/devkitpro/portlibs/switch/switch/* /opt/devkitpro/portlibs/switch/
            rm -rf /opt/devkitpro/portlibs/switch/switch
          fi
          # Also fetch HTTPS addons
          wget -q https://github.com/proconsule/nxmp-portlibs/releases/download/v1.0.0/portlibs-https.rar -O /tmp/portlibs-https.rar || true
          if [ -f /tmp/portlibs-https.rar ]; then
            7z x /tmp/portlibs-https.rar -o/opt/devkitpro/portlibs/ -y > /dev/null 2>&1 || true
          fi
          rm -f /tmp/portlibs*

      - name: Build and install jansson for Switch
        shell: bash
        run: |
          [ -f /opt/devkitpro/switchvars.sh ] && . /opt/devkitpro/switchvars.sh
          git clone --depth 1 https://github.com/akheron/jansson.git /tmp/jansson
          cd /tmp/jansson
          mkdir build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=/opt/devkitpro/switch.cmake \
                -DCMAKE_INSTALL_PREFIX=/opt/devkitpro/portlibs/switch \
                -DJANSSON_BUILD_SHARED_LIBS=OFF \
                -DJANSSON_BUILD_DOCS=OFF \
                -DJANSSON_EXAMPLES=OFF \
                ..
          make -j$(nproc) install

      - name: Build NXMP NRO
        run: |
          export PATH=$DEVKITPRO/devkitA64/bin:$PATH
          make clean || true
          make -j$(nproc)

      - name: Upload NXMP NRO
        uses: actions/upload-artifact@v4
        with:
          name: nxmp-nro-release
          path: |
            *.nro
            *.nacp
